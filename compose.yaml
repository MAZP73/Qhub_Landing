name: qhub_info

# `docker compose up -d --build` → landing + panel de desarrolladores (nginx) en http://localhost:8081
# Las variables públicas salen del .env de la raíz (compose lo lee solo) y se incrustan en el build.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_QHUB_API_BASE_URL: ${VITE_QHUB_API_BASE_URL:?falta VITE_QHUB_API_BASE_URL en .env}
        VITE_QHUB_PLATFORM_URL: ${VITE_QHUB_PLATFORM_URL:?falta VITE_QHUB_PLATFORM_URL en .env}
    image: qhub_info/web
    environment:
      API_ORIGIN: ${VITE_QHUB_API_BASE_URL}     # origen permitido en la CSP (connect-src)
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6
